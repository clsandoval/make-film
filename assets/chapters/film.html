<!doctype html>
<!-- make-film "chapters" style. Content and brand live in chapters.json (copied to chapters.js by scripts/sync.mjs).
     Renderer contract: window.__seek(t), window.__duration, window.__ready. Everything is a pure function of t. -->
<html><head><meta charset="utf-8">
<script src="chapters.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--deep)}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:var(--font);color:var(--ink);
  background:radial-gradient(ellipse 120% 90% at 50% 45%, color-mix(in srgb,var(--ground) 80%,#3060a0 20%) 0%, var(--ground) 45%, var(--deep) 100%)}
#contours{position:absolute;inset:0;width:1920px;height:1080px}
#cam{position:absolute;inset:0;overflow:hidden}
#world{position:absolute;left:0;top:0;width:14000px;height:10000px;transform-origin:0 0}
.abs{position:absolute}
.reg{position:absolute;width:1920px;height:1080px}
.card{position:absolute;background:var(--card);color:var(--cardInk);border-radius:22px;overflow:hidden;padding:30px 40px;
  box-shadow:0 30px 80px rgba(3,10,25,.55)}
.card.dark{background:color-mix(in srgb,var(--deep) 85%,transparent);color:var(--ink);border:2px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.card.chip{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);
  font-family:var(--mono);font-size:32px;display:flex;align-items:center;justify-content:center;box-shadow:none;padding:0}
.card .k{font-family:var(--mono);font-size:26px;opacity:.6;margin-bottom:16px}
.card .big{font-size:48px;font-weight:700;line-height:1.25}
.card .src{font-size:28px;opacity:.55;margin-top:18px}
.card .msg{font-size:40px;white-space:nowrap}
.card .mono{font-family:var(--mono);font-size:46px}
.card .cover{font-size:48px;font-weight:800;line-height:1.05;margin-top:30px}
.card .pages{display:flex;gap:30px;height:100%;align-items:center}
.card .pages i{flex:1;height:200px;background:#fff;border:2px solid rgba(12,31,64,.14);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.card .bar{font-family:var(--mono);font-size:26px;opacity:.65;margin-bottom:40px}
.card .bars i{display:block;height:54px;border-radius:8px;background:var(--exp);margin:0 0 26px 0}
.card .call{display:flex;gap:60px;justify-content:center;margin-top:30px}
.card .call span{width:260px;height:260px;border-radius:26px;background:color-mix(in srgb,var(--ground) 70%,#fff 10%);display:flex;align-items:center;justify-content:center;font-size:90px;font-weight:700}
.card .call span.me{border:6px solid var(--accent2)}
.card .cap{margin-top:40px;font-size:40px;background:rgba(247,247,247,.07);border-radius:16px;padding:24px 30px}
.count{position:absolute}
.count .n{font-weight:800;font-size:190px;letter-spacing:-0.03em;line-height:1;transform-origin:0 60%}
.count .l{font-size:50px;font-weight:700;margin-top:10px;color:var(--accent)}
.flag{font-family:var(--mono);font-weight:600;font-size:26px;letter-spacing:.06em;border-radius:10px;padding:6px 14px;white-space:nowrap;display:inline-block;vertical-align:middle}
.flag.trial{color:var(--trial);border:2px solid var(--trial);background:color-mix(in srgb,var(--trial) 10%,transparent)}
.flag.exp{color:color-mix(in srgb,var(--exp) 60%,#fff);border:2px solid var(--exp);background:color-mix(in srgb,var(--exp) 12%,transparent)}
.rh{position:absolute;left:180px;top:54px;display:flex;align-items:center;gap:22px;white-space:nowrap}
.rh .no{font-family:var(--mono);font-size:48px;color:var(--accent)}
.rh .ti{font-weight:800;font-size:58px;letter-spacing:-0.015em}
.rh .sub{font-size:32px;opacity:.62}
.pain{position:absolute;left:184px;top:146px;font-size:50px;opacity:.86;white-space:nowrap}
.ben{position:absolute;left:0;width:1920px;text-align:center;top:930px;font-size:58px;font-weight:800;letter-spacing:-0.015em;color:var(--accent);white-space:nowrap}
#tocT{position:absolute;left:330px;top:128px;font-weight:800;font-size:84px;letter-spacing:-0.02em;white-space:nowrap}
#tocT span{display:inline-block}
#tocS{position:absolute;left:334px;top:238px;font-size:36px;opacity:.62;white-space:nowrap}
#tocRule{position:absolute;left:334px;top:310px;height:3px;background:color-mix(in srgb,var(--accent) 50%,transparent);width:1252px;transform-origin:0 50%}
.tl{position:absolute;left:334px;height:100px;width:1252px}
.tl .hl{position:absolute;left:-40px;right:-40px;top:-6px;bottom:-6px;border-radius:18px;background:color-mix(in srgb,var(--accent) 10%,transparent);border:2px solid color-mix(in srgb,var(--accent) 45%,transparent)}
.tl .ring{position:absolute;left:-2px;top:22px;width:56px;height:56px;border-radius:50%;border:3px solid rgba(247,247,247,.28)}
.tl .ck{position:absolute;left:-2px;top:22px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--ground);font-weight:800;font-size:34px;display:flex;align-items:center;justify-content:center}
.tl .row{position:absolute;left:92px;top:14px;display:flex;align-items:center;gap:26px;white-space:nowrap}
.tl .no{font-family:var(--mono);font-size:50px;color:var(--accent);width:44px}
.tl .ti{font-weight:700;font-size:62px;letter-spacing:-0.01em}
.tl .sub{font-size:34px;opacity:.6}
.lst{left:260px;top:210px;width:1400px;padding:40px 56px 30px;backface-visibility:hidden}
.lh{font-weight:800;font-size:52px;margin-bottom:18px}
.li{display:flex;align-items:baseline;gap:26px;padding:20px 0;border-top:2px solid rgba(12,31,64,.09)}
.li .kk{font-weight:800;font-size:40px;width:380px;flex:none;white-space:nowrap}
.li .v{font-size:36px;line-height:1.3;opacity:.85;white-space:nowrap}
#ovl{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;font-family:var(--mono);font-size:28px;white-space:nowrap;transform:translate(-50%,-50%);
  background:color-mix(in srgb,var(--deep) 85%,transparent);padding:8px 16px;border-radius:10px;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.lbl b{color:var(--accent);margin-right:12px}
#end{position:absolute;inset:0}
</style></head>
<body><div id="stage">
<svg id="contours" viewBox="0 0 1920 1080"></svg>
<svg width="0" height="0" style="position:absolute"><defs>
  <filter id="mb" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB"><feGaussianBlur id="mbg" stdDeviation="0 0"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
</defs></svg>
<div id="cam"><div id="world">
  <div class="reg" id="HUB"><div id="tocT"></div><div id="tocS"></div><div id="tocRule"></div><div id="tocLines"></div></div>
  <div id="regions"></div>
  <svg id="lsvg" class="abs" style="left:0;top:0;overflow:visible" width="14000" height="10000"></svg>
</div></div>
<div id="ovl"><div id="labels"></div>
  <svg class="abs" style="left:0;top:0;overflow:visible" width="1920" height="1080">
    <path id="dtrail" fill="none" stroke-width="5" stroke-linecap="round"/><circle id="dglow" r="30" filter="url(#glow)"/><circle id="dcore" r="14"/></svg></div>
<div id="end">
  <img id="emas" class="abs" style="left:210px;top:250px;width:590px;display:none">
  <div id="edot" class="abs" style="width:63px;height:63px;border-radius:50%;background:var(--dot);left:858px;top:430px"></div>
  <div id="ewrapW" class="abs" style="left:984px;top:340px;overflow:hidden;height:240px"><div id="ewm" style="font-weight:800;font-size:200px;letter-spacing:-0.03em;line-height:240px;white-space:nowrap"></div></div>
  <div id="eurl" class="abs" style="left:862px;top:610px;font-weight:500;font-size:62px"></div>
  <div id="epy" class="abs" style="left:864px;top:708px;font-weight:600;font-size:32px;opacity:.45"></div>
  <div id="ecr" class="abs" style="left:0;width:1920px;top:1016px;text-align:center;font-size:22px;opacity:.42"></div>
</div>
</div>
<script>
const F=window.FILM, P=F.brand.palette;
const $=id=>document.getElementById(id);
const root=document.documentElement.style;
Object.entries(P).forEach(([k,v])=>root.setProperty('--'+k,v));root.setProperty('--font',F.brand.font);root.setProperty('--mono',F.brand.mono);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lin=(t,a,b)=>clamp((t-a)/(b-a));
const eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eO=x=>1-Math.pow(1-x,3);
const eQ=x=>x<.5?16*x*x*x*x*x:1-Math.pow(-2*x+2,5)/2;
const eB=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const R=(t,a,b,e=eO)=>e(lin(t,a,b));
const mix=(a,b,k)=>a+(b-a)*k;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function land(el,k,dy=36){el.style.opacity=k;el.style.transform=`translateY(${(1-k)*dy}px) scale(${.96+.04*k})`;}
function pop(el,k){el.style.opacity=clamp(k*1.6);el.style.transform=`scale(${.6+.4*eB(k)})`;}

/* ---------- beat grid and chapter timing (bars) ---------- */
const BEAT=60/F.music.bpm, BAR=4*BEAT, PH=F.music.phase||0;
const B=bar=>PH+bar*BAR;
const CH=[...F.chapters.map(c=>({...c,kind:'chapter'})),{...F.panel,kind:'panel'}];
const N=CH.length, L=[], E=[];
{let l=1.5;for(let i=0;i<N;i++){L.push(l);E.push(l+CH[i].bars);l=E[i]+1;}}
const FIN=E[N-1], PULL=FIN+.75, DOT=PULL+1.25, ENDB=DOT+.25, TOTB=ENDB+1.5;
const TOTAL=Math.round(B(TOTB)*30)/30;

/* ---------- world layout: chapters on an ellipse around the hub ---------- */
const HUB=[7000,5000];
const RC=CH.map((c,i)=>{const a=(-40+i*360/N)*Math.PI/180;return[Math.round(HUB[0]+2900*Math.cos(a)),Math.round(HUB[1]+2250*Math.sin(a))];});
const SIDE=RC.map(c=>c[0]>=HUB[0]-200?1:-1);
const place=(el,c)=>{el.style.left=(c[0]-960)+'px';el.style.top=(c[1]-540)+'px';};
place($('HUB'),HUB);
const xs=RC.map(c=>c[0]),ys=RC.map(c=>c[1]);
const MAPC=[(Math.min(...xs)+Math.max(...xs))/2,(Math.min(...ys)+Math.max(...ys))/2];
const MAPS=Math.min(1920/(Math.max(...xs)-Math.min(...xs)+2200),1080/(Math.max(...ys)-Math.min(...ys)+1500));

/* ---------- build DOM from chapters.json ---------- */
$('tocT').innerHTML=F.hub.title.split(' ').map((w,i)=>`<span id="hw${i}">${esc(w)}</span>`).join(' ');
const HW=F.hub.title.split(' ').length;
$('tocS').textContent=F.hub.subtitle;
const LY=i=>352+i*(620/Math.max(5,N));
const flagHtml=f=>f?`<span class="flag ${f.kind}">${esc(f.text)}</span>`:'';
$('tocLines').innerHTML=CH.map((c,i)=>`<div class="tl" id="tl${i}" style="top:${LY(i)}px"><div class="hl" id="hl${i}"></div><div class="ring" id="rg${i}"></div><div class="ck" id="ck${i}">✓</div>
  <div class="row" id="rw${i}"><span class="no">${i+1}</span><span class="ti">${esc(c.title)}</span><span class="sub">${esc(c.sub||'')}</span>${flagHtml(c.flag)}</div></div>`).join('');
let rh='';
CH.forEach((c,i)=>{
  rh+=`<div class="reg" id="R${i}"${c.kind==='panel'?' style="perspective:2400px"':''}><div class="rh" id="h${i}"><span class="no">${i+1}</span><span class="ti">${esc(c.title)}</span><span class="sub">${esc(c.sub||'')}</span>${flagHtml(c.flag)}</div>`;
  if(c.pain)rh+=`<div class="pain" id="p${i}">${esc(c.pain)}</div>`;
  if(c.kind==='chapter')c.beats.forEach((b,j)=>{const r=b.card;
    if(b.count)rh+=`<div class="count" id="b${i}_${j}" style="left:${r.x}px;top:${r.y}px;width:${r.w}px"><div class="n" id="n${i}_${j}">0</div><div class="l">${esc(b.count.label)}</div></div>`;
    else rh+=`<div class="card${b.dark?' dark':''}${b.chip?' chip':''}" id="b${i}_${j}" style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px">${b.html||''}</div>`;});
  else c.groups.forEach((g,j)=>{rh+=`<div class="card lst" id="g${i}_${j}"><div class="lh">${esc(g.label)}</div>${g.rows.map((r,k)=>`<div class="li" id="r${i}_${j}_${k}"><span class="kk">${esc(r[0])}</span><span class="v">${esc(r[1])}</span></div>`).join('')}</div>`;});
  if(c.benefit)rh+=`<div class="ben" id="bn${i}">${esc(c.benefit)}</div>`;
  rh+=`</div>`;});
$('regions').innerHTML=rh;CH.forEach((c,i)=>place($('R'+i),RC[i]));
$('labels').innerHTML=CH.map((c,i)=>`<div class="lbl" id="lb${i}"><b>${i+1}</b>${esc(c.title)}${c.flag?` <span style="margin-left:10px;color:var(--${c.flag.kind==='trial'?'trial':'exp'})">${esc(c.flag.text)}</span>`:''}</div>`).join('');
$('ewm').textContent=F.brand.name;$('eurl').textContent=F.brand.url;$('epy').textContent=F.brand.org;$('ecr').textContent=F.music.credit||'';
if(F.brand.mascot){$('emas').src=F.brand.mascot;$('emas').style.display='block';}
else{['edot','ewrapW','eurl','epy'].forEach(id=>{const e=$(id);e.style.left=(parseFloat(e.style.left)-320)+'px';});}

/* contours */
(function(){let s='';for(let i=0;i<9;i++)s+=`<path id="cn${i}" fill="none" stroke="${P.ink}" stroke-width="1.6"/>`;$('contours').innerHTML=s;})();
function contours(t,cx,cy){for(let i=0;i<9;i++){let d='';const y0=90+i*118-((cy-HUB[1])*.035)%118,a=38+12*Math.sin(i*1.7),f=.0021+.0004*(i%3),ph=i*1.3+t*.18-cx*.00035*(1+i*.1);
  for(let x=-40;x<=1960;x+=40){const y=y0+a*Math.sin(x*f+ph)+18*Math.sin(x*f*2.3+ph*1.7);d+=(x<0?'M':'L')+x+' '+y.toFixed(1);}
  const p=$('cn'+i);p.setAttribute('d',d);p.setAttribute('stroke-opacity',(.045+.02*(i%2)).toFixed(3));}}

/* ---------- lines from each contents row to its chapter ---------- */
const hubO=[HUB[0]-960,HUB[1]-540];let LLEN=[];
function buildLines(){let h='';
  CH.forEach((c,i)=>{const w=$('rw'+i).offsetWidth;const y0=hubO[1]+LY(i)+50;
    const x0=SIDE[i]>0?hubO[0]+334+92+w+34:hubO[0]+334-44;const rx=RC[i][0]-960,ry=RC[i][1]-540;
    const x3=SIDE[i]>0?rx+120:rx+1860,y3=ry+95;const k=.45*Math.hypot(x3-x0,y3-y0);
    const d=`M ${x0} ${y0} C ${x0+SIDE[i]*k} ${y0}, ${x3-SIDE[i]*k} ${y3}, ${x3} ${y3}`;
    h+=`<path id="lg${i}" d="${d}" fill="none" stroke="${P.accent}" stroke-opacity=".35" stroke-width="16" stroke-linecap="round" filter="url(#glow)"/><path id="ln${i}" d="${d}" fill="none" stroke="${P.accent}" stroke-width="6" stroke-linecap="round"/><circle id="tg${i}" r="22" fill="${P.accent}" opacity=".5" filter="url(#glow)"/><circle id="tp${i}" r="10" fill="#fff"/>`;});
  $('lsvg').innerHTML=h;CH.forEach((c,i)=>LLEN.push($('ln'+i).getTotalLength()));}
const LAUNCH=i=>i===0?B(1.0):B(E[i-1]+.5), LANDT=i=>B(L[i]);

/* ---------- shots: auto-frame each beat so its card fills ~60% of the frame ---------- */
function autoShot(r){const s=clamp(Math.min(.6*1920/r.w,.62*1080/Math.max(r.h,1),1920/(r.w+120),1080/(r.h+200)),.9,1.5);return[r.x+r.w/2,r.y+r.h/2,s];}
const SHOTS=CH.map((c,i)=>{const sh=[[0,960,150,1.12]];
  if(c.kind==='chapter')c.beats.forEach(b=>{if(b.chip&&!b.shot)return;const s=b.shot||autoShot(b.card);sh.push([b.at,s[0],s[1],s[2]]);});  // chips ride along with the shot before them
  else c.groups.forEach((g,j)=>{const t0=j*c.bars/c.groups.length;sh.push([t0+.1,960,470,1.12]);g.rows.forEach((r,k)=>sh.push([t0+.25+k*.25,960,375+k*90,1.3]));});
  if(c.benefit)sh.push([c.bars-.75,960,620,1.0]);
  return sh.filter((s,j,a)=>!j||s[0]>a[j-1][0]+.05);});
const W2=(i,f)=>[RC[i][0]-960+f[1],RC[i][1]-540+f[2],f[3]];
const MOVES=[];
{const H=[HUB[0],HUB[1],1.18];
 MOVES.push({t0:0,t1:B(.45),to:H,e:'o',dip:0,from:[HUB[0]+30,HUB[1]+20,1.42]});
 CH.forEach((c,i)=>{MOVES.push({t0:LAUNCH(i),t1:LANDT(i),to:W2(i,SHOTS[i][0]),dive:i});
   SHOTS[i].slice(1).forEach(f=>{const t0=B(L[i]+f[0]);MOVES.push({t0,t1:t0+.34,to:W2(i,f),e:'q',dip:0});});
   MOVES.push({t0:B(E[i]),t1:B(E[i]+.25),to:H,e:'q',dip:.62});});
 MOVES.push({t0:B(PULL),t1:B(PULL+.25),to:[MAPC[0],MAPC[1],MAPS],e:'z',dip:0});}
function drift(st,dt){return[st[0]+10*dt,st[1]+3*dt,st[2]*(1+.008*dt)];}
function cam(t){let st=MOVES[0].from,end=0;
  for(const m of MOVES){
    if(t<m.t0){const d=drift(st,t-end);return{x:d[0],y:d[1],s:d[2]};}
    const fr=drift(st,m.t0-end);
    if(t<m.t1){const k=lin(t,m.t0,m.t1);
      if(m.dive!==undefined){const i=m.dive,pk=eIO(k);const pt=$('ln'+i).getPointAtLength(Math.max(.1,LLEN[i]*pk));
        const a=R(k,0,.22,eIO),b=R(k,.72,1,eIO);const sTip=mix(mix(fr[2],1.75,a),.85,R(k,.2,.55,eIO));
        return{x:mix(mix(fr[0],pt.x,a),m.to[0],b),y:mix(mix(fr[1],pt.y,a),m.to[1],b),s:mix(sTip,m.to[2],b)};}
      if(m.e==='z'){const q=eIO(k);return{x:mix(fr[0],m.to[0],q),y:mix(fr[1],m.to[1],q),s:Math.exp(mix(Math.log(fr[2]),Math.log(m.to[2]),q))};}
      const q=m.e==='o'?eO(k):eQ(k);
      return{x:mix(fr[0],m.to[0],q),y:mix(fr[1],m.to[1],q),s:mix(fr[2],m.to[2],q)*(1-m.dip*Math.sin(Math.PI*q))};}
    st=m.to;end=m.t1;}
  const d=drift(st,t-end);return{x:d[0],y:d[1],s:d[2]};}
const toScr=(c,x,y)=>[960+(x-c.x)*c.s,540+(y-c.y)*c.s];
window.__timing={BEAT,BAR,PH,L,E,FIN,PULL,DOT,ENDB,TOTB,TOTAL,moves:MOVES.map(m=>+m.t0.toFixed(3)),
  cues:{launch:CH.map((c,i)=>LAUNCH(i)),land:CH.map((c,i)=>LANDT(i)),exit:E.map(B),tick:E.map(e=>B(e+.25)),
        beats:CH.map((c,i)=>c.kind==='chapter'?c.beats.map(b=>B(L[i]+b.at)):c.groups.flatMap((g,j)=>g.rows.map((r,k)=>B(L[i]+j*c.bars/c.groups.length+.25+k*.25)))),
        benefit:CH.map((c,i)=>c.benefit?B(L[i]+c.bars-.75):null),pull:B(PULL),dot:B(DOT),end:B(ENDB)}};

function render(t){
  const c=cam(t),cp=cam(t-1/30);
  const vx=(c.x-cp.x)*c.s*30,vy=(c.y-cp.y)*c.s*30,vz=Math.abs(Math.log(c.s/cp.s))*30*900;
  const bx=Math.min(48,Math.abs(vx)*.0045+vz*.0045),by=Math.min(48,Math.abs(vy)*.0045+vz*.0045);
  $('world').style.transform=`translate(${960-c.x*c.s}px,${540-c.y*c.s}px) scale(${c.s})`;
  if(bx>.6||by>.6){$('mbg').setAttribute('stdDeviation',`${bx.toFixed(2)} ${by.toFixed(2)}`);$('cam').style.filter='url(#mb)';}else $('cam').style.filter='none';
  contours(t,c.x,c.y);
  const worldFade=1-R(t,B(DOT),B(DOT)+.45,eIO);$('cam').style.opacity=worldFade;
  /* hub: the whole page lands inside bar 0 */
  for(let i=0;i<HW;i++){const k=R(t,B(0)+i*BEAT/2,B(0)+i*BEAT/2+.18);const e=$('hw'+i);e.style.opacity=k;e.style.filter=k<1?`blur(${(1-k)*12}px)`:'none';e.style.transform=`translateY(${(1-k)*20}px)`;}
  const sk=R(t,B(.25),B(.25)+.25);$('tocS').style.opacity=sk*.62;
  $('tocRule').style.transform=`scaleX(${R(t,B(.25),B(.45),eIO)})`;
  CH.forEach((ch,i)=>{const t0=B(.375)+i*BEAT/2;const k=R(t,t0,t0+.22);$('tl'+i).style.opacity=k;$('tl'+i).style.transform=`translateX(${(1-k)*-40}px)`;
    const tick=B(E[i]+.25);const tk=R(t,tick,tick+.3);$('ck'+i).style.opacity=clamp(tk*1.5);$('ck'+i).style.transform=`scale(${.3+.7*eB(tk)})`;$('rg'+i).style.opacity=1-tk;

        e.style.opacity=(j?fin>=.5:fin>0)&&fout<.5?(j?1:fin):0;e.style.transform=`rotateX(${j?(fin-1)*180:0}deg) rotateX(${fout*180}deg)`;

  const mk=R(t,B(ENDB)+.1,B(ENDB)+.6);$('emas').style.opacity=mk;$('emas').style.transform=`scale(${.9+.1*mk})`;
  $('eurl').style.opacity=R(t,B(ENDB)+.7,B(ENDB)+1.0);$('epy').style.opacity=.45*R(t,B(ENDB)+.9,B(ENDB)+1.2);$('ecr').style.opacity=.42*R(t,B(ENDB)+1.1,B(ENDB)+1.5);
}
