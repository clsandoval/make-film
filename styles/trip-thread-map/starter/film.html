<!doctype html><html><head><meta charset="utf-8"><title>trip-thread-map</title>
<!-- Trip film: #trip thread ⇄ drawn map with the route ⇄ 3D pin dive, cut to a beat grid. 1080x1920 (9:16).
     Everything on screen comes from trip.json (synced to trip.js). Renderer contract: window.__seek(t) returns a
     promise that resolves once any photo/frame is decoded, window.__duration, window.__timing, window.__ready.
     Every frame is a pure function of t. No network: the map and terrain are drawn from inline data (geo.js). -->

</style></head><body>
<canvas id="map" class="full" width="1080" height="1920"></canvas>
<canvas id="ov" class="full" width="1080" height="1920"></canvas>
<canvas id="dive" class="full" width="1080" height="1920"></canvas>
<div id="dhud" class="layer"><div class="n" id="dn"></div><div class="c" id="dc"></div></div>

<div id="intro" class="layer"><div id="title"></div><div class="win" id="win"></div></div>

<script>

  if (g.kind === 'dive') { g.lead = s.lead || 2; g.dive = s.dive || 6; g.card = s.card || 4; g.beats = g.lead + g.dive + g.card; } else g.beats = s.beats || 4;

  s.focus = tg; });

const REV = SEG.find(s => s.kind === 'reveal'), PIDS = Object.keys(P);

const S_STOP = 1.25, S_DIVE = 1.5; const CAM = [], MOVES = [];

const hubP = P[F.hub]; let last = { x: hubP.x, y: hubP.y, s: .8, cy: 900 };

SEG.forEach(s => {
  const f = s.focus.map(k => P[k]), fx = f.length ? f.reduce((m, p) => m + p.x, 0) / f.length : null, fy = f.length ? f.reduce((m, p) => m + p.y, 0) / f.length : null;

  if (s.kind === 'stop') { kf(s.t0, .5, fx, fy, S_STOP, 330, eIO, { arc: .35 }); kf(s.t0 + 2 * BEAT, .4, fx, fy, S_STOP * 1.1, 330); }
  if (s.kind === 'dive') { kf(s.t0, s.lead * BEAT * .55, fx, fy, S_DIVE, 960, eIO, { arc: .35 }); const a = s.t0 + s.lead * BEAT, dd = s.dive * BEAT; MOVES.push(a, a + dd * .4, a + dd * .75, a + dd + BEAT * s.card * .5); }
  if (s.kind === 'thread') { const c = CAM[CAM.length - 1]; kf(s.t0, .35, c.x, c.y - 120, c.s * .75, 760, eQ, { whip: s.whip ? 1 : 0 }); kf(s.t0 + 2 * BEAT, .4, c.x, c.y - 120, c.s * .8, 760); }
});
kf(tb(PB), .8, CX + 70 / SALL, CYW, SALL, 1100); kf(tb(FIN * 4), 1.2, CX + 70 / SALL, CYW, SALL * .9, 1100);   // shifted left: labels sit right of pins

  return { x: c.x - dx / (c.s * g), y: c.y - Math.min(k, 3) * 8 / (c.s * g), s: c.s * g, cy: c.cy }; }

  for (const k of CAM) { if (t < k.t) break; const fr = drift(st, k.t - land, i);
    if (t < k.t + k.d) { const e = k.e(lin(t, k.t, k.t + k.d)); let ls = mix(Math.log(fr.s), Math.log(k.s), e);

      return { x: mix(fr.x, k.x, e), y: mix(fr.y, k.y, e), s: Math.exp(ls), cy: mix(fr.cy, k.cy, e) }; }

(function drawPlate() { const w = plate.width, h = plate.height, cx = plate.getContext('2d'), im = cx.createImageData(w, h), d = im.data;
  const hex = c => { const n = parseInt(c.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  const lo = hex(PAL.mapLow), hi = hex(PAL.mapHigh), sn = hex(PAL.mapSnow), wa = hex(PAL.mapWater);

/* ---------- placeholder photo art (swap for the traveller's own photos: stop.photo or stop.seq) ---------- */

    `<rect width="940" height="1240" fill="url(#g${r})"/><circle cx="${250 + rn() * 440}" cy="${220 + rn() * 160}" r="90" fill="#fff7e0" opacity=".85"/>${g}` +
    `<text x="470" y="160" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="26" fill="rgba(0,0,0,.45)">PLACEHOLDER · add your photo</text></svg>`; }
/* ---------- build DOM ---------- */

  if (s.kind === 'stop') { const two = s.stops.length > 1, h = two ? 600 : 1240;

  if (s.kind === 'dive') { const c = s.counter;
    ch += `<div class="dcard" id="dk${i}"><div class="tag">${s.tag || ''}</div><div class="name nw">${s.name || P[s.place].name}</div>${s.stamp ? `<span class="flag">${s.stamp}</span>` : ''}${s.fact ? `<div class="fact">${s.fact}</div>` : ''}` +

});
$('cards').innerHTML = ch;

$('ph').textContent = tpl(F.pullback.title); $('ps').textContent = tpl(F.pullback.subtitle || '');
$('ew').textContent = F.brand.name; $('es').textContent = F.brand.sub || '';

// WebGL draws offscreen and is copied into a 2D canvas, so every screenshot sees the frame it seeked to

/* ---------- frame sequences (footage as pre-extracted JPG frames; <video> is not frame-accurate) ---------- */
let pending = [];
