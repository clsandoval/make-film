<!doctype html>
<!--
  The rig, not the set. Copy this to film.html and build your frames inside it.

  Everything above the "YOUR FILM" marker is machinery you should not need to
  change: the stage, the deterministic clock, the helpers, the crossfade loop and
  the renderer contract. Everything below it is your film.

  Laws this file enforces for you:
    - the GSAP root ticker is unhooked, so nothing advances except a seek
    - the grain is stepped from the playhead, not a clock
    - cue() refuses to guess which word you meant
    - the timeline is not built until document.fonts.ready, so anything that
      measures live layout measures real font metrics
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>film</title>
<style>
  /* Your palette. Derive it from the subject's real CSS — do not inherit one. */
  :root {
    --stage:    #ffffff;
    --text:     #111111;
    --text-dim: #666666;
    --accent:   #cc4400;   /* ONE accent. A third hue is almost always a mistake. */
    --hairline: #e2e2e2;
    --display: system-ui, sans-serif;
    --body:    system-ui, sans-serif;
    --mono:    ui-monospace, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; }

  /* The renderer screenshots THIS element, not the viewport — setting the
     viewport alone silently produces a file at the wrong shape with the right
     label, so film.mjs resizes the stage to FILM_W/FILM_H. It does that AFTER
     the page load event — by which point this timeline has already been built
     and growIn() has already measured scrollHeight — so these CSS numbers are
     the size the composition lays out and measures against, not a preview
     convenience. Keep them equal to film.json's `stage`. FILM_W/FILM_H alone
     give a correctly-sized file with the wrong internal layout, which is why a
     re-laid-out second aspect is a second composition with its own CSS
     (FILM_PAGE=film-mobile.html), never a flag on this one; a letterboxed cut
     comes off the master in deliverables.sh. */
  #stage {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: var(--stage); color: var(--text); font-family: var(--body);
    -webkit-font-smoothing: antialiased;
  }
  .scene { position: absolute; inset: 0; opacity: 0; will-change: opacity, transform; }

  /* Two-node camera: the outer node dollies, the inner node turns. On one
     element they fight over a single transform matrix and the move judders. */
  .dolly  { position: absolute; inset: 0; transform-origin: 50% 50%; }
  .turn   { position: absolute; inset: 0; transform-style: preserve-3d; }

  /* Reserve space for text that types in later. An empty block element is a
     zero-height box, so everything below it jumps when the first character lands. */
  .line { display: block; min-height: 1.2em; }

  /* Put this on anything countTo() writes into. Proportional numerals have
     different widths, so a count-up reflows its own box nearly every frame and
     visibly jitters. Grow a numeral with transform: scale, never font-size. */
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

  /* A real texture, self-contained — no PNG to generate or ship. Keep the
     opacity low and mask it off near-black areas: grain over near-black defeats
     the encoder (65s came out an 85MB master where the same cut without grain
     encodes at 21MB). */
  #grain, #vignette { position: absolute; inset: -20%; pointer-events: none; }
  #grain { opacity: .035; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.5'/></svg>"); }
  #vignette { inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.16) 100%); }
</style>
</head>
<body>
<div id="stage">

  <!-- ============================ YOUR FILM ============================ -->
  <!-- One <section class="scene" data-frame="ID"> per frame in film.json.
       The id must match exactly: it is the join key across film.json,
       audio_meta.json, timeline.json and this file. -->

  <section class="scene" data-frame="01-open">
    <h1 id="headline" class="line" style="position:absolute;left:96px;top:760px;width:888px;
        font-family:var(--display);font-size:88px;letter-spacing:-.02em"></h1>
  </section>

  <!-- One section per frame, or the composition throws before __ready and no
       renderer opens it. film.example.json declares three; these are the other two. -->

  <section class="scene" data-frame="02-claim">
    <h1 class="line" style="position:absolute;left:96px;top:760px;width:888px;
        font-family:var(--display);font-size:88px;letter-spacing:-.02em"></h1>
  </section>

  <section class="scene" data-frame="03-close">
    <h1 class="line" style="position:absolute;left:96px;top:760px;width:888px;
        font-family:var(--display);font-size:88px;letter-spacing:-.02em"></h1>
  </section>

  <!-- =================================================================== -->

  <!-- data-camera so the probe counts #grain as present without its transform.
       An unmarked grain node stepping at 1/12 makes every frame read as never
       settling, and makes every dead window unreachable. -->
  <div id="grain" data-camera></div>
  <div id="vignette"></div>
</div>

<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script src="timeline.js"></script>
<script>
(async () => {
  // Fonts before layout: anything that measures live geometry would otherwise
  // bake fallback metrics into every frame of the render.
  await document.fonts.ready;

  // The determinism keystone. GSAP's root update is unhooked from
  // requestAnimationFrame, so the timeline advances ONLY when we seek it.
  gsap.ticker.remove(gsap.updateRoot);

  const TL = window.TIMELINE;
  const $ = (id) => document.getElementById(id);
  const frameOf = (id) => {
    const f = TL.frames.find((f) => f.id === id);
    if (!f) throw new Error(`no frame "${id}" in timeline.json`);
    return f;
  };
  const at  = (id) => frameOf(id).start;
  const end = (id) => frameOf(id).start + frameOf(id).hold;

  // Strip surrounding punctuation, keep internal apostrophes ("don't").
  const norm = (s) => s.toLowerCase().replace(/^[^a-z0-9]+|[^a-z0-9']+$/g, "");

  /** Film-time start of a word. It throws rather than guess. */
  function cue(frameId, needle, occurrence = 1) {
    const f = frameOf(frameId);
    const want = norm(needle);
    const hits = f.words.filter((w) => norm(w.word) === want);
    if (!hits.length) throw new Error(`${frameId}: no word "${needle}" in [${f.words.map((w) => w.word)}]`);
    if (hits.length > 1 && occurrence === 1) {
      throw new Error(`${frameId}: "${needle}" matches ${hits.length} words — pass an occurrence`);
    }
    if (occurrence > hits.length) throw new Error(`${frameId}: "${needle}" has no occurrence ${occurrence}`);
    return hits[occurrence - 1].start;
  }

  /** Type a string by tweening a character count. Reveal a line as ONE unit —
      a word painted statically at frame entry sits there alone until its cue. */
  function typeInto(el, text, tl, start, dur) {
    const state = { n: 0 };
    el.textContent = "";
    tl.to(state, { n: text.length, duration: dur, ease: "none",
      onUpdate: () => { el.textContent = text.slice(0, Math.round(state.n)); } }, start);
  }

  /** Grow a panel to exactly its content height. Measured after fonts.ready.
      Two tweens on one start, deliberately: a dark panel ramping its opacity
      over the full entrance does not composite to a dark panel at 71%, it
      composites to a third ground — a grey slab. Transform carries the
      entrance; opacity gets out of the way in 0.22s. Every DOM check passes on
      the one-tween version; only a rendered frame shows it. */
  function growIn(el, tl, start, dur = 0.6) {
    const h = el.scrollHeight;
    tl.fromTo(el, { height: 0 }, { height: h, duration: dur, ease: "power3.out" }, start);
    tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power2.out" }, start);
  }

  /** A counter that is a pure function of the playhead, so a backward seek is
      correct too. Never accumulate state across frames. The target element
      needs class="num" — proportional numerals reflow the box every frame. */
  function countTo(el, from, to, tl, start, dur,
                   // "en-US" pinned: a bare toLocaleString() reads the host
                   // locale, so the same commit prints 1,234,567 here and
                   // 1.234.567 elsewhere — a different pixel and a different
                   // string for the approved-figures sweep to read back.
                   fmt = (n) => Math.round(n).toLocaleString("en-US")) {
    const state = { n: from };
    tl.to(state, { n: to, duration: dur, ease: "power2.out",
      onUpdate: () => { el.textContent = fmt(state.n); } }, start);
  }

  const master = gsap.timeline({ paused: true });
  const XF = 0.42; // crossfade between scenes

  TL.frames.forEach((f, i) => {
    const el = document.querySelector(`[data-frame="${f.id}"]`);
    if (!el) throw new Error(`no <section data-frame="${f.id}"> for the timeline's frame`);
    master.fromTo(el, { opacity: 0 }, { opacity: 1, duration: XF, ease: "power2.out" }, f.start);
    if (i < TL.frames.length - 1) {
      master.to(el, { opacity: 0, duration: XF, ease: "power2.in" }, f.start + f.hold - XF * 0.5);
    }
  });

  // Film grain, stepped from the playhead over a fixed table. No RNG, no clock.
  const GRAIN = [[0,0],[-91,47],[63,-112],[-140,-33],[111,88],[-27,131],[148,19],[-72,-95]];
  for (let i = 0; i * (1 / 12) < TL.duration; i++) {
    const [gx, gy] = GRAIN[i % GRAIN.length];
    master.set($("grain"), { x: gx, y: gy }, i * (1 / 12));
  }

  // ========================= YOUR TIMELINE =========================
  // Every reveal sits on a measured word. Never on a typed second.
  //
  //   typeInto($("headline"), "Your headline.", master, at("01-open") + 0.2, 0.9);
  //   master.fromTo($("stat"), {opacity:0, y:14}, {opacity:1, y:0, duration:.42},
  //                 cue("02-claim", "twice"));
  //
  // Every reveal must COMPLETE by hold - 1s, or it arrives as the shot cuts.
  typeInto($("headline"), "Replace me.", master, at("01-open") + 0.2, 0.9);
  // =================================================================

  master.pause(0);

  // The renderer contract. Three globals, and that is the whole API surface.
  window.__seek = (t) => { master.seek(t, false); };
  window.__duration = TL.duration;
  window.__ready = true;
})();
</script>
</body>
</html>
